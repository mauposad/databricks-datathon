resources:
  jobs:
    build_facility_tables:
      name: build_facility_tables
      description: >
        Rebuilds workspace.datathon: silver PIN geography, silver facilities, gold facility-service evidence,
        the find_care() function and the district planner. Runs location_validation_scoring first (repaired rows +
        per-cluster location scores); otherwise reads only from the Virtue Foundation Marketplace share.
      tasks:
        # Location validation first: silver reads its repaired rows and per-cluster scores
        # (workspace.datathon.bronze_locval_facilities_repaired, silver_location_validation)
        - task_key: location_validation
          run_job_task:
            job_id: ${resources.jobs.location_validation_scoring.id}

        - task_key: silver_pincode_geo
          notebook_task:
            notebook_path: ../src/01_silver_pincode_geo.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_facilities
          depends_on:
            - task_key: silver_pincode_geo
            - task_key: location_validation
          notebook_task:
            notebook_path: ../src/02_silver_facilities.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_facility_services
          depends_on:
            - task_key: silver_facilities
          notebook_task:
            notebook_path: ../src/03_gold_facility_services.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: find_care_function
          depends_on:
            - task_key: gold_facility_services
          notebook_task:
            notebook_path: ../src/04_find_care_function.sql
            warehouse_id: ${var.warehouse_id}

        - task_key: district_planner
          depends_on:
            - task_key: find_care_function
          notebook_task:
            notebook_path: ../src/05_district_planner.sql
            warehouse_id: ${var.warehouse_id}

resources:
  apps:
    care_finder:
      name: ${var.care_finder_app_name}
      description: Find Indian healthcare facilities for a service near a place, with cited evidence and confidence.
      source_code_path: ../app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: llm-endpoint
          serving_endpoint:
            name: databricks-meta-llama-3-3-70b-instruct
            permission: CAN_QUERY
